<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · Novanest HRM</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#03A9E7">
</head>
<body>

<div class="login-shell">
  <div class="login-box">
    <div class="brand"><img src="img/logo-symbol.png" alt="Novanest" class="brand-logo"> Novanest HRM</div>
    <div class="filetab">Reset password</div>
    <div class="panel" style="border-top-left-radius:0;">
      <div class="panel-body">
        <div id="formState">
          <form id="resetForm">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" minlength="6" required placeholder="At least 6 characters">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" minlength="6" required>
            <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Reset password</button>
          </form>
        </div>
        <div id="invalidState" style="display:none;">
          <p style="font-size:13px;">This link is missing a token. Please request a new reset link.</p>
          <a class="btn btn-ghost" href="forgot-password.html" style="width:100%; justify-content:center;">Request new link</a>
        </div>
        <div id="doneState" style="display:none;">
          <p style="font-size:13px;">Your password has been reset. You can now sign in.</p>
          <a class="btn btn-primary" href="login.html" style="width:100%; justify-content:center;">Go to sign in</a>
        </div>
      </div>
    </div>
    <p style="text-align:center; margin-top:16px;"><a href="login.html" style="font-size:13px; color: var(--ink-soft);">&larr; Back to sign in</a></p>
  </div>
</div>

<script src="js/common.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('formState').style.display = 'none';
  document.getElementById('invalidState').style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (newPassword !== confirmPassword) {
    toast('Passwords do not match', true);
    return;
  }
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    await api('/auth/reset-password', {
      method: 'POST',
      body: { token, newPassword }
    });
    document.getElementById('formState').style.display = 'none';
    document.getElementById('doneState').style.display = 'block';
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
