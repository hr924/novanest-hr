<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · Novanest HRM</title>
<link rel="stylesheet" href="css/styles.css?v=1785305713">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#03A9E7">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Novanest HRM">
</head>
<body>

<div class="login-shell">
  <div class="login-box">
    <div class="brand"><img src="img/logo-symbol.png" alt="Novanest" class="brand-logo"> Novanest HRM</div>
    <div class="filetab">Set a new password</div>
    <div class="panel" style="border-top-left-radius:0;">
      <div class="panel-body">
        <div id="rpMissing" style="display:none;">
          <p style="margin-top:0; font-size:14px;">This reset link is missing or invalid. Please request a new one.</p>
          <a class="btn btn-primary" href="forgot-password.html" style="width:100%; justify-content:center;">Request a new link</a>
        </div>
        <form id="resetForm">
          <label for="rpPassword">New password</label>
          <input id="rpPassword" type="password" minlength="6" required placeholder="At least 6 characters">
          <label for="rpConfirm">Confirm new password</label>
          <input id="rpConfirm" type="password" minlength="6" required>
          <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center; margin-top:12px;">Set new password</button>
        </form>
      </div>
    </div>
    <p style="text-align:center; margin-top:16px;"><a href="login.html" style="font-size:13px; color: var(--ink-soft);">&larr; Back to sign in</a></p>
  </div>
</div>

<script src="js/common.js?v=1785305713"></script>
<script>
const rpToken = new URLSearchParams(window.location.search).get('token');
if (!rpToken) {
  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('rpMissing').style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('rpPassword').value;
  const confirm = document.getElementById('rpConfirm').value;
  if (password !== confirm) {
    toast('Passwords do not match', true);
    return;
  }
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    await api('/auth/reset-password', {
      method: 'POST',
      body: { token: rpToken, password }
    });
    toast('Password updated — you can now sign in');
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
