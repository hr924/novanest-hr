<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password · Novanest HRM</title>
<link rel="stylesheet" href="css/styles.css?v=1785305713">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#03A9E7">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Novanest HRM">
</head>
<body>

<div class="login-shell">
  <div class="login-box">
    <div class="brand"><img src="img/logo-symbol.png" alt="Novanest" class="brand-logo"> Novanest HRM</div>
    <div class="filetab">Forgot password</div>
    <div class="panel" style="border-top-left-radius:0;">
      <div class="panel-body">
        <div id="fpForm">
          <p style="margin-top:0; color: var(--ink-soft); font-size:14px;">Enter the email address on your account and we'll send you a link to set a new password.</p>
          <form id="forgotForm">
            <label for="fpEmail">Email</label>
            <input id="fpEmail" type="email" placeholder="you@company.com" required>
            <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center; margin-top:12px;">Send reset link</button>
          </form>
        </div>
        <div id="fpDone" style="display:none;">
          <p style="margin-top:0; font-size:14px;">If an account exists for that email, a password reset link has been sent. Check your inbox (and spam folder) — the link expires in 1 hour.</p>
        </div>
      </div>
    </div>
    <p style="text-align:center; margin-top:16px;"><a href="login.html" style="font-size:13px; color: var(--ink-soft);">&larr; Back to sign in</a></p>
  </div>
</div>

<script src="js/common.js?v=1785305713"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    await api('/auth/forgot-password', {
      method: 'POST',
      body: { email: document.getElementById('fpEmail').value }
    });
    document.getElementById('fpForm').style.display = 'none';
    document.getElementById('fpDone').style.display = 'block';
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
