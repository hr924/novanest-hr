<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password · Novanest HRM</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#03A9E7">
</head>
<body>

<div class="login-shell">
  <div class="login-box">
    <div class="brand"><img src="img/logo-symbol.png" alt="Novanest" class="brand-logo"> Novanest HRM</div>
    <div class="filetab">Forgot password</div>
    <div class="panel" style="border-top-left-radius:0;">
      <div class="panel-body">
        <div id="formState">
          <p class="muted" style="margin-top:0; font-size:13px;">Enter the email address on your account. If it matches one of our records, we'll send a link to reset your password.</p>
          <form id="forgotForm">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@company.com" required>
            <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Send reset link</button>
          </form>
        </div>
        <div id="doneState" style="display:none;">
          <p style="font-size:13px;">If an account exists for that email, a password reset link is on its way. It expires in 1 hour and can only be used once.</p>
        </div>
      </div>
    </div>
    <p style="text-align:center; margin-top:16px;"><a href="login.html" style="font-size:13px; color: var(--ink-soft);">&larr; Back to sign in</a></p>
  </div>
</div>

<script src="js/common.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    await api('/auth/forgot-password', {
      method: 'POST',
      body: { email: document.getElementById('email').value }
    });
    document.getElementById('formState').style.display = 'none';
    document.getElementById('doneState').style.display = 'block';
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
